north_star:
  player_experience:
    - "Equip one satchel on the back."
    - "Equip up to two pouches at the waist/belt."
    - "Bag contents belong to the physical ItemStack and move with that ItemStack."
    - "Press a configurable key (initial default: B) to open one unified Pack Inventory menu."
    - "The Pack Inventory shows equipped satchel/pouch storage plus the player's normal inventory."
    - "Shift-clicking should be predictable and safe."
    - "Bag contents should be visible in a tooltip after the core system is stable."
    - "Wearable models should render after storage/equipment/menu correctness is proven."
  initial_capacities:
    satchel: 9
    upgraded_satchel: 18
    pouch: 3
    upgraded_pouch: 6
    rationale: "Matches the current Scout-Recrafted gameplay capacities; treat as tunable game design."
  future_optional_feature:
    name: "Integrated Inventory"
    description: >
      Optionally display bag slots around the vanilla inventory screen in a classic Scout-like layout.
      This is explicitly post-MVP and must not be used as the underlying storage system.

success_definition:
  - "No known item duplication or loss in survival, creative, death/respawn, logout, or multiplayer flows."
  - "Dedicated server works without client-class loading errors."
  - "Bag contents persist through save/reload and remain attached to the correct bag ItemStack."
  - "Equipped bags are discovered through Trinkets Updated, not through ad-hoc global player state."
  - "The server is authoritative for all inventory mutation."
  - "No bag can be inserted into any bag."
  - "Core MVP requires zero vanilla inventory GUI mixins."
  - "A clean build succeeds from a fresh checkout using documented prerequisites."
  - "All release-gate manual tests and available automated tests pass."

non_goals_until_core_release_candidate:
