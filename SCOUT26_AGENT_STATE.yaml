decision_log:
  - id: "ADR-001"
    date: "2026-08-10"
    status: "ACCEPTED"
    decision: "Build a new 26.1-native mod instead of porting Scout-Recrafted line-by-line."
    reason: "26.1 tooling/API changes and Scout's fragile inventory-screen mixins make a clean architecture lower risk."
  - id: "ADR-002"
    date: "2026-08-10"
    status: "ACCEPTED"
    decision: "Use a dedicated Pack Menu for MVP; classic vanilla inventory integration is post-MVP."
    reason: "Reduces mixin surface and isolates storage correctness from vanilla inventory UI internals."
  - id: "ADR-003"
    date: "2026-08-10"
    status: "ACCEPTED"
    decision: "Store contents on each bag ItemStack using a typed custom data component."
    reason: "The physical bag carries its own inventory across equipment, drops, containers, saves, and movement."
  - id: "ADR-004"
    date: "2026-08-10"
    status: "ACCEPTED"
    decision: "Use Trinkets Updated for equipment roles, not for bag content storage."
    reason: "Separates equipment attachment from inventory ownership."
  - id: "ADR-005"
    date: "2026-08-10"
    status: "ACCEPTED"
    decision: "Prohibit nested bags."
    reason: "Avoid recursive inventory semantics and a large class of duplication/serialization risks."
  - id: "ADR-006"
    date: "2026-08-10"
    status: "ACCEPTED"
    decision: "Default to behavioral reference rather than copied Scout-Recrafted implementation code."
    reason: "Produces a cleaner 26.1-native design and simplifies provenance/licensing."
  - id: "ADR-007"
    date: "2026-08-11"
    status: "ACCEPTED"
    decision: >
      Represent bag contents as an immutable sparse list of ItemStackTemplate snapshots in a persistent,
      explicitly network-synchronized data component; derive capacity only from the concrete BagItem.
    reason: >
      Minecraft 26.1.2 ItemStack copies may share component values, so immutable snapshots plus component
      replacement prevent cross-bag aliasing while preserving normal save/load and creative copy behavior.
  - id: "ADR-008"
    date: "2026-08-11"
    status: "ACCEPTED"
    decision: >
      Use Trinkets Updated's built-in chest/back slot for one satchel and legs/belt indices 0 and 1 for
      left and right pouches. Request/extend the slots through data resources and locate equipment through
      a server-side integration layer whose handles re-resolve and require exact ItemStack identity.
    reason: >
      This follows the locked 4.0.0-beta.3+26.1 slot loader, item-tag validator, testmod, and attachment APIs;
      it avoids parallel equipment storage and prevents a stale handle from targeting a replacement bag.
  - id: "ADR-009"
    date: "2026-08-11"
    status: "ACCEPTED"
    decision: >
      Open a dedicated extended PackMenu from an empty C2S intent. Send only server-derived capacities as
      opening layout data; keep contents and slot identities server-owned. Route bag slots in satchel,
      left-pouch, right-pouch order and validate every captured EquippedBagHandle before mutation.
    reason: >
      Minecraft's synchronized menu protocol already owns slot changes. Server rediscovery plus exact live
      ItemStack identity prevents client-forged capacity/content state and fails closed after Trinkets inventory
      rebuild, replacement, or unequip, while vanilla moveItemStackTo provides merge-before-empty behavior.
  - id: "ADR-010"
    date: "2026-08-11"
    status: "ACCEPTED"
    decision: >
      Keep P5 lifecycle behavior on the vanilla server thread and Trinkets Updated's physical ItemStack lifecycle.
      Normalize corrupt serialized counts at BagContents construction, invalidate server menus for dead, removed,
      disconnected, or spectator owners, and add no custom death/respawn/logout storage or synchronization layer.
    reason: >
      Exact Minecraft 26.1.2 and Trinkets Updated 4.0.0-beta.3+26.1 sources show that vanilla validates menus
      before clicks, saves players on disconnect, and closes invalid menus, while Trinkets drops or copies physical
      equipped stacks according to keepInventory and rebuilds attachments with new ItemStack identities. Reusing
      those authoritative paths avoids duplicate write-back state and lets exact-identity handles fail closed.
  - id: "ADR-011"
    date: "2026-08-11"
    status: "ACCEPTED"
    decision: >
      Use a client-source code renderer for equipped bags, reusing normal item models and textures, because the
      pinned Trinkets data renderer can select legs/belt but cannot distinguish belt index 0 from index 1. Use
      vanilla crafting_transmute recipes for upgrades so the base bag's component patch is preserved.
    reason: >
      Index-aware rendering keeps left and right pouches visually distinct without common-source client leakage.
      Minecraft 26.1.2 TransmuteRecipe copies the input ItemStack component patch to the target item, preserving
      populated BAG_CONTENTS through upgrades without custom crafting mutation logic.
  - id: "ADR-012"
    date: "2026-08-11"
    status: "ACCEPTED"
    decision: >
      Permit a separately authorized, default-disabled P7-B prototype that appends 30 fixed dormant slots to
      InventoryMenu, activates exact-identity BagContainer bindings only for a validated survival inventory session,
      and uses no more than four documented mixin targets: InventoryMenu, AbstractContainerScreen,
      RecipeBookComponent, and EffectsInInventory. Creative integrated mutation is explicitly excluded.
    reason: >
      Exact Minecraft 26.1.2 sources show a viable 76-slot container-ID-0 topology within the 128-slot packet limit
      and a normal server-authoritative click path in survival, while creative inventory accepts direct creative
      writes only for vanilla indices 1-45. Fixed bilateral indices, Fabric ScreenEvents, captured handles, and the
      existing BagContainer/BagStorageRules boundary avoid the historical need for packet-handler, player-lifecycle,
      global-menu, and Trinkets-internal mixins. Any expansion beyond the ADR hard stops changes the recommendation
      to shipping the proven Pack Menu without Integrated Inventory.
  - id: "ADR-013"
    date: "2026-08-31"
    status: "ACCEPTED"
    decision: >
      Implement Ready Slots as a server-thread exact-handle swap between bag-local slot 0 and
      Inventory.setSelectedItem, with role-only bounded payloads, immediate container-ID-0 owner sync,
      Trinkets full-stack observer sync, a conservative render whitelist, and an arbitrary ready ItemStack
      submission in place of the old bag image inside the existing BagTrinketRenderer. Keep both owners in their existing single player-data
      snapshot and require automated force-kill/restart tests to accept only an exact complete pre- or post-state.
    reason: >
      Exact Minecraft 26.1.2 and Trinkets Updated 4.0.0-beta.3+26.1 sources prove the hotbar mutation APIs,
      component-aware stack comparison and remote payload path, arbitrary item render-state API, and shared
      temporary/live/backup player-save boundary. This avoids client-owned content, a second inventory, a new
      render mixin, and any save window in which one half can be serialized without the other.

