  - "Do not implement classic vanilla-inventory slot injection."
  - "Do not support Forge/NeoForge."
  - "Do not implement migration from old Scout/Scout-Recrafted bag data yet."
  - "Do not add nested bags."
  - "Do not add remote/shared/cloud storage."
  - "Do not optimize rendering before storage correctness."
  - "Do not add config complexity beyond what is required for basic development."
  - "Do not copy LGPL implementation code by default."

