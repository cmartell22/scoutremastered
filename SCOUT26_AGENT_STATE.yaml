known_risks:
  - id: "R-001"
    severity: "HIGH"
    risk: "Live ItemStack identity/locator becomes stale while PackMenu is open."
    mitigation: >
      P3 EquippedBagHandle re-resolves the current Trinkets slot and requires the exact captured ItemStack object.
      P4 validates all captured handles before every menu mutation, closes a stale server menu, and gives each
      live-handle BagContainer a second fail-closed mutation guard. P5 additionally rejects dead, removed,
      disconnected, and spectator owners and manually verified automatic closure plus cursor conservation when
      a live Trinkets resource reload rebuilt equipped stacks.
  - id: "R-002"
    severity: "HIGH"
    risk: "Mutable ItemStack/list aliasing inside a data component causes cross-bag mutation or hash/equality issues."
    mitigation: "Immutable component value; defensive copies; component replacement on mutation."
  - id: "R-003"
    severity: "HIGH"
    risk: "Creative-mode stack cloning duplicates a non-empty bag."
    mitigation: >
      P2 intentionally follows vanilla ItemStack copy semantics: copying a non-empty bag copies its contents.
      The initially shared value is immutable and subsequent mutations replace it, so copies diverge safely.
      This behavior is documented, covered by BagStorageTest/P5HardeningTest, and manually verified through
      creative middle-click cloning and divergent mutation; do not add identity UUIDs without a new ADR.
  - id: "R-004"
    severity: "HIGH"
    risk: "Trinkets 26.1.x API churn/alpha compatibility."
    mitigation: >
      Version 4.0.0-beta.3+26.1 remains locked. P3 inspected immutable tag 2509961c1dcf5925dae02f8684156976295a2236,
      isolated library access in TrinketsIntegration/EquippedBagHandle, and covered the chosen slot schema with tests.
  - id: "R-005"
    severity: "MEDIUM"
    risk: "Client/server source-set leakage."
    mitigation: "Use split environment source sets and dedicated-server smoke test each phase touching client code."
  - id: "R-006"
    severity: "MEDIUM"
    risk: "Classic inventory integration recreates old Scout fragility."
    mitigation: "P7 only, feature flagged, minimal mixins, core remains independent."

bug_regressions:
  # Add one entry for every bug discovered, especially duplication/loss/desync.
  # Never remove a regression entry; mark fixed_in_commit and test evidence.
  entries:
    - id: "BUG-P5-001"
      phase: "P5"
      severity: "P1"
      status: "FIXED"
      summary: "Malformed serialized bag entries could retain an item count above that item's real stack maximum or a non-positive streamed count."
      impact: >
        Command/corruption-crafted entries such as 99 diamonds could decode but fail strict ItemStack creation,
        making the stored entry inaccessible and liable to be purged by a later mutation. This was not reachable
        through normal server-authoritative menu play, but it violated fail-closed corruption handling.
      root_cause: >
        ItemStackTemplate's persistent codec permits counts through 99 and its stream codec carries a raw integer,
        while BagContents previously checked slot bounds and nested-bag eligibility without normalizing against
        the concrete item's getMaxStackSize or rejecting non-positive streamed counts.
      fix: >
        BagContents now creates a one-item strict template probe, rejects invalid/non-positive/ineligible entries,
        and clamps retained counts to the concrete item's actual maximum before storing the immutable snapshot.
      fixed_in_commit: "ef1a28543d2aa381fd1b05eb8ca27e781210ff11"
      regression_tests:
        - "BagStorageTest.oversizedEntriesClampToTheItemsActualMaximum"
        - "BagStorageTest.streamDecodeClampsHugeCountsAndRejectsNonPositiveCounts"
    - id: "BUG-P6-001"
      phase: "P6"
      severity: "P2"
      status: "FIXED"
      summary: "Equipped item models rendered horizontally, parallel to the ground, instead of vertically against the player model."
      impact: "Satchel and pouch textures were visible but unusably oriented in third person; storage and inventory behavior were unaffected."
      root_cause: >
        BagTrinketRenderer applied an additional positive 90-degree X rotation even though Minecraft's FIXED
        item display transform already supplied the required upright item-plane orientation.
      fix: >
        Removed the extra X rotation for both branches to place the item plane vertically, then applied a shared
        180-degree Z rotation to turn the vertically oriented but upside-down textures upright. Position, scale,
        belt-index separation, and satchel Y-facing rotation remain unchanged.
      fixed_in_commit: "73af048aae9c242dc28c6c8286f641b03b070a4e"
      evidence:
        - "Human screenshot confirmed the original horizontal orientation."
        - "Human recheck confirmed the corrected plane was vertical but upside down."
        - "Client compilation and all 30 automated tests passed after the correction."
        - "Human final recheck approved the upright, flat-against-body orientation and accepted the current item-model attachments as placeholder rendering."
    - id: "BUG-P7B-001"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "An already-open wide recipe book could compute InventoryScreen position before the integrated-inventory acknowledgement activated left-pouch metadata."
      impact: "The initial enabled inventory opening could overlap a left pouch until another recipe-book layout update; storage authority and contents were unaffected."
      root_cause: >
        RecipeBookComponent.updateScreenPosition runs during InventoryScreen initialization, while exact client bag bindings intentionally activate only after the
        server acknowledgement and before the subsequent full vanilla container state.
      fix: >
        The acknowledgement handler performs one guarded vanilla Screen widget-layout refresh after exact client bindings activate. A weak per-screen lifecycle
        guard prevents the refresh from registering duplicate ScreenEvents callbacks or sending a second open intent.
      fixed_in_commit: "09a11e8ec72d6f755f322100083808ed8934d863"
      regression_tests:
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
    - id: "BUG-P7B-002"
      phase: "P7-B"
      severity: "P1"
      status: "FIXED"
      summary: "Creating or joining an integrated-server world failed with 'Invalid player data' when Trinkets and Scout26 both appended InventoryMenu slots."
      impact: "No player could enter a single-player world while the P7-B build was installed, blocking all interactive acceptance testing."
      root_cause: >
        Scout26's default Mixin priority 1000 made its InventoryMenu constructor RETURN callback run after the
        Trinkets Updated InventoryMenu Mixin at priority 500. Trinkets had therefore already appended its slots
        when Scout26 asserted the vanilla 46-slot topology, and Scout26 could not reserve ADR-012 indices 46-75.
      fix: >
        Set the Scout26 InventoryMenu Mixin priority to 400 so its RETURN callback runs before Trinkets,
        reserves the fixed dormant indices 46-75, and permits Trinkets to append its own slots afterward.
        The change remains within ADR-012's four authorized Mixin targets.
      fixed_in_commit: "6464284e531c7357d83e7923c769db31c1c3dc76"
      evidence:
        - "The initial enabled acceptance launch reproduced java.lang.IllegalStateException: ADR-012 InventoryMenu topology must contain exactly 76 slots during ServerPlayer construction."
        - "Exact trinkets-4.0.0-beta.3+26.1 bytecode inspection confirmed its InventoryMenu Mixin priority is 500 and it injects at constructor RETURN."
        - "After the priority fix, the clean build passed all 37 tests and quickPlaySingleplayer logged Player132 in and joined P7B-test without the invalid-player-data failure."
    - id: "BUG-P7B-003"
      phase: "P7-B"
      severity: "P1"
      status: "FIXED"
      summary: "Opening the enabled survival inventory with no bags equipped left most of the vanilla GUI invisible or displaced, including the usable player inventory and hotbar slots."
      impact: "The player could not access newly obtained bags to equip them, blocking the enabled Integrated Inventory acceptance matrix."
      root_cause: >
        AbstractContainerScreenMixin declared the target's final imageWidth and imageHeight fields as initialized
        @Shadow fields with `= 0`. Mixin copied those initializers into each transformed AbstractContainerScreen
        constructor after Minecraft assigned the real constructor arguments, forcing both dimensions back to zero.
        InventoryScreen therefore rendered a zero-sized vanilla background and centered its remaining elements as
        though the container were 0 by 0, producing the missing and lower-right-displaced GUI.
      fix: >
        Remove all four target-field shadows and expose leftPos, topPos, imageWidth, and imageHeight through Mixin
        @Accessor methods instead. The accessors satisfy IntegratedScreenLayoutAccess without injecting any field
        initializer writes, while the outside-click correction reads the same live target values. The earlier
        acknowledgement-resize guard remains as a correctly narrowed layout refresh but was not the root fix.
      failed_attempt_commit: "43050ca2143a5eb22d433e01b605334a4a978756"
      fixed_in_commit: "b09f01f1277ed2b5ebd96ba2be11dc4b422aae20"
      evidence:
        - "The human-provided 1024x768 screenshot showed the player/equipment/crafting elements but no usable vanilla player inventory or hotbar after opening with no bags."
        - "The second human screenshot disproved the resize hypothesis: the no-bag branch added in 43050ca could not execute, yet the GUI remained broken and appeared farther offset at the different window size."
        - "Pre-fix exported transformed bytecode proved the constructor assigned imageWidth/imageHeight from its parameters and then immediately overwrote both fields with zero."
        - "Post-fix exported transformed bytecode assigns each dimension only from its constructor parameter and the generated Scout26 accessor methods only read the target fields."
        - "compileClientJava plus all 37 tests passed, followed by a clean build with all 10 actionable tasks executed."
        - "The corrected quick-play client logged Player135 into P7B-test with no Mixin application error; visual inventory confirmation remains pending."
        - "Human retest on 2026-08-11 confirmed the corrected no-bag inventory is centered and complete, with the vanilla background, 27 main slots, and 9 hotbar slots all visible."
    - id: "BUG-P7B-004"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Equipped base and upgraded satchels do not display their 9/18-slot Integrated Inventory expansion, although the independent B-key Pack Menu exposes the bags correctly."
      impact: "Integrated Inventory storage remains inaccessible from the vanilla survival inventory for equipped satchels; the proven B-key Pack Menu is an unaffected workaround."
      root_cause: >
        The acknowledgement correctly activated the client against the exact equipped satchel ItemStack before
        InventoryMenu.sendAllDataToRemote delivered the integrated slot contents. That same full vanilla state then
        replaced the client-side Trinkets equipment ItemStack object. EquippedBagHandle correctly rejected its now-stale
        exact identity, so active capacity fell from 9 to 0 before the next rendered frame even though a fresh Trinkets
        lookup still found a capacity-9 satchel. The renderer and every layout/menu/event precondition were healthy.
      rejected_hypothesis: >
        Minecraft does not reuse one InventoryScreen instance across E-key openings in 26.1.2; exact bytecode shows
        a new InventoryScreen(player) allocation on every normal inventory keypress. The diagnostic opening also
        logged one first initialization and no later reinitialization, so the weak identity guard did not suppress
        the observed satchel session.
      evidence:
        - "Human screenshot showed a satchel equipped in Trinkets chest/back with a complete vanilla inventory but no row below it; the human reproduced this for base and upgraded satchels and confirmed the B-key Pack Menu works."
        - "Diagnostic server log: discovered=[true,false,false], active=IntegratedInventoryData[satchelCapacity=9, leftPouchCapacity=0, rightPouchCapacity=0]."
        - "Diagnostic client log: server capacity 9, discovered=[true,false,false], and active client capacity 9."
        - "The active-render diagnostic placed after IntegratedInventoryPanels' layout/menu/data preconditions did not log, narrowing the next probe to those entry conditions or event invocation rather than networking or bag discovery."
        - "Exact Fabric Screen API bytecode confirms per-screen events are recreated on init/resize and afterBackground is injected immediately after Screen.extractBackground; no second init occurred in the captured reproduction."
        - "Bounded method-entry diagnostics proved afterBackground and afterExtract both execute with the expected layout interface, menu interface, and player inventory-menu identity."
        - "Deterministic base-satchel trace: ACK server=9, active=9, fresh=9; the next tick active=0 while fresh=9, proving full-sync exact-handle invalidation."
        - "Post-fix deterministic trace: ready server=9, active=9, fresh=9 after the full vanilla sync."
        - "The final clean build passed all 38 tests with zero failures, errors, or skips; the built jar contains IntegratedInventoryReadyPayload and all temporary diagnostic code was removed."
        - "Human retest confirmed both base and upgraded satchel expansions now render; the follow-up inverted-bevel and post-interaction invalidation defects are tracked separately as BUG-P7B-005 and BUG-P7B-006."
      fix: >
        Add an ordered IntegratedInventoryReadyPayload after sendAllDataToRemote. The existing acknowledgement still
        activates dormant slots before vanilla applies their contents; the ready phase then captures the replacement
        Trinkets ItemStack and rebinds only the exact client handle without clearing the synchronized client slot mirror.
        Capacity and role checks remain server-derived and fail closed, and the authoritative server binding is unchanged.
      fixed_in_commit: "2e9ac7456c57d0b169e0ba34583c5a887fbb047d"
      regression_tests:
        - "IntegratedInventoryTest.clientFinalizationRebindsExactReplacementWithoutDiscardingSyncedContents"
        - "IntegratedInventoryTest.sessionPayloadsCarryOnlyIntentAndServerDerivedCapacities"
    - id: "BUG-P7B-005"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Integrated satchel slots used an inverted raised bevel instead of vanilla's recessed slot appearance."
      impact: "Base and upgraded satchel panels were readable but looked vertically inverted relative to every vanilla inventory slot."
      root_cause: >
        IntegratedInventoryPanels drew the white highlight on the top and left edges inside a dark outer rectangle.
        Vanilla recessed slots use dark top/left edges and light bottom/right edges, so the custom bevel read as raised.
      fix: >
        Draw a white 18-pixel square first, overlay a dark 17-pixel top/left square, then fill the 16-pixel slot
        interior. This leaves the light edge only on the bottom/right and matches vanilla's recessed direction.
      fixed_in_commit: "a7ab309acf3e1ad143f75a221c651ff340d9a9b5"
      evidence:
        - "The human screenshot shows light top/left edges on the Scout26 row opposite the recessed vanilla slots immediately above it."
        - "Client compilation and the 39-test clean build passed before human retest."
        - "The next human screenshot described the result as a good improvement and raised only panel spacing, residual interaction flicker, and color refinements; the recessed bevel is accepted."
    - id: "BUG-P7B-006"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Any integrated bag mutation or equipped-satchel replacement made the panel disappear until the inventory screen was reopened."
      impact: "Normal pickup, placement, removal, double-click collection, and satchel swaps interrupted Integrated Inventory use, although reopening E restored it and the B-key Pack Menu remained available."
      root_cause: >
        The ready payload repaired the exact client handle only after the initial full state. Every later server
        broadcast sends changed integrated slots before the changed Trinkets equipment ItemStack. Applying that last
        equipment-slot packet replaces the client ItemStack object, correctly invalidating the exact handle again;
        no subsequent ready phase existed until the screen was manually reopened. The first fix added that refresh,
        but exact invalidation still made the client slot inactive for one frame and the refresh ACK called the
        destructive initial-activation path, briefly clearing the synchronized mirror before the replacement state.
      fix: >
        Retain separate server-derived client layout data so presentation remains stable during revalidation. An
        end-client-tick tracker compares expected capacity, exact active binding, and freshly equipped capacity; one
        mismatch transition sends the existing empty open intent. The server rediscovers and binds the current physical
        bag, then ACK/full-state/ready restores the exact client handle. Persistent mismatches are debounced and cannot
        spam requests. The refinement keeps client mirror slots presentation-active during only that stale-handle
        interval and makes recurring ACKs rebind without clearing their contents. Authoritative server containers still
        require the captured ItemStack identity, and exact client active capacity still falls to zero to trigger refresh.
      initial_fix_commit: "a7ab309acf3e1ad143f75a221c651ff340d9a9b5"
      fixed_in_commit: "7e6703618def7e801fb4719f01086b0a787f17e9"
      regression_tests:
        - "IntegratedInventoryTest.refreshTrackerDebouncesEachAuthoritativeSessionMismatch"
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
      evidence:
        - "Exact Minecraft 26.1.2 source confirms AbstractContainerMenu.broadcastChanges walks slots in index order and ClientPacketListener replaces each synchronized client slot ItemStack."
        - "Deterministic live pickup trace: initial ready expected=9/active=9/equipped=9; slot 46 click; one refresh at expected=9/active=0/equipped=9; final ready restored 9/9/9 in the same second."
        - "All property-gated auto-equip/open/click hooks and diagnostic logs were removed before the clean production build."
        - "The final clean build passed 39 tests with zero failures, errors, or skips and retained exactly the four ADR-012 Mixin targets with no @Overwrite."
        - "Human retest confirmed the panel persists after interactions but exposed one residual bag-only frame flicker."
        - "The stale-client regression now proves the mirror remains visible with its synchronized contents while exact active capacity is zero; the authoritative stale-handle regression remains fail-closed."
        - "After the mirror-preserving refinement, the human described the recipe-book toggle as the only remaining issue; no residual bag-panel flicker was reported."
    - id: "BUG-P7B-007"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "The satchel panel had a two-unit gap below the vanilla inventory, clipped the upgraded panel at the acceptance resolution, and used undifferentiated vanilla gray styling."
      impact: "The gap consumed four physical pixels at GUI scale 2, enough to cut off the upgraded satchel panel at 854x480, and the gray panel did not visually distinguish bag storage."
      root_cause: >
        Vanilla InventoryScreen is 166 GUI units high, but Scout26 started the panel at relative y=168 and its first
        slots at y=174. Those two unused GUI units became the visible four-pixel seam and matching bottom overflow.
        The proof-of-layout renderer also retained its provisional vanilla-gray color constants. The first correction
        removed the relative gap, but vanilla still vertically centered only its own 166-unit surface; attaching a
        42-unit upgraded panel therefore left the combined 208-unit surface low and clipped at the acceptance height.
      fix: >
        Keep the satchel panel directly attached at vanilla y=166 with its slots at y=172, and center the vanilla plus
        satchel surface as one unit. Give the panel the same five-unit inset above and below its slot grid, producing
        heights 28/46 and centering offsets 14/23 for base/upgraded satchels. Reapply that offset after resizes and
        capacity changes. The warm leather-brown panel, dark-brown recess, and tan highlight remain.
      initial_fix_commit: "7e6703618def7e801fb4719f01086b0a787f17e9"
      alignment_fix_commit: "eaa6078c36e70e54862d80154c64885405a84b13"
      fixed_in_commit: "703234822d121c4e515e97d29b09e8953486d7b2"
      regression_tests:
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
      evidence:
        - "The acceptance screenshot shows a four-physical-pixel seam at GUI scale 2 and the upgraded panel cropped at the 480-pixel window edge."
        - "The layout test locks the panel interval to y=[166,208) and the upgraded slot rows to y=172 and y=190."
        - "A clean test/build executed all 10 tasks and passed 39 tests with zero failures, errors, or skips."
        - "The next human screenshot confirmed the brown panel and removed gap but still showed the second upgraded row clipped because the vanilla-only surface remained vertically centered."
        - "The initial combined-surface correction passed the 39-test clean build before the lower-border refinement."
        - "The following human screenshot confirmed full clearance but exposed the one-unit lower inset versus vanilla's five-unit border; the final geometry locks symmetric five-unit insets and offsets 14/23."
        - "The human accepted the final graphics as perfect after the symmetric-border refinement."
    - id: "BUG-P7B-008"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Pouch panels sat beside the equipment area instead of forming a continuous chamfered grid with the three-row player inventory."
      impact: "Both pouches appeared too high, a ten-unit horizontal gap broke the inventory-grid rhythm, and the upgraded left pouch looked uneven or reversed despite its inner-first slot ordering."
      root_cause: >
        Prototype coordinates placed pouch contents at relative y=17 and inner x=-20/180, while vanilla's player
        inventory starts at y=84 and its outer slot-frame boundaries are x=7 and x=169. Side backgrounds began at
        y=11 and stopped at the vanilla edge, so neither slots nor silhouettes shared the classic Scout grid/join.
      fix: >
        Place pouch rows at y=84/102/120 and inner columns at x=-10/170, with upgraded columns extending outward.
        Position the 66-unit side backgrounds at y=77 and meet the vanilla slot boundaries at x=7/169. Render a
        seven-unit brown diagonal join through the vanilla margin while restricting every dark outline pixel to the
        exposed outer pouch body. Custom frame boundaries meet the vanilla first/last slot frames without overlap.
      alignment_fix_commit: "eaa6078c36e70e54862d80154c64885405a84b13"
      fixed_in_commit: "703234822d121c4e515e97d29b09e8953486d7b2"
      regression_tests:
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
      evidence:
        - "The human comparison screenshot shows classic pouch slots on the exact same three horizontal grid lines as vanilla and the inner columns directly adjoining its outer columns."
        - "The final clean build executed all 10 tasks and passed 39 tests with zero failures, errors, or skips."
        - "Human refinement feedback identified dark pixels on the diagonal joins and a right-side background pixel shadowing the last vanilla slot; the join now contains brown only inside the vanilla surface."
        - "The human accepted the final graphics as perfect after the brown-only join refinement."
    - id: "BUG-P7B-009"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Vertically centering the combined satchel surface left the recipe-book button at its old screen Y, overlapping the player inventory."
      impact: "The recipe-book control covered an ordinary inventory slot whenever an equipped satchel shifted the inventory upward."
      root_cause: >
        InventoryScreen derives the recipe button from screen height rather than topPos and creates it before the
        server-derived satchel capacity arrives. Scout26 shifted topPos after acknowledgement but did not apply the
        identical offset to the already-created 20x18 ImageButton. The first correction positioned it on open, but
        AbstractRecipeBookScreen recalculates and writes the original height-based button position on every open/close
        click, so the button dropped back down after either toggle.
      fix: >
        During the same reposition pass, identify the InventoryScreen recipe ImageButton by its vanilla dimensions
        and set its Y to height/2-22 minus the server-derived satchel centering offset. This runs on acknowledgement,
        capacity refresh, ScreenEvents reinitialization/resizing, and immediately before every inventory-frame widget
        extraction so a vanilla click-driven reset is corrected before it can render.
      initial_fix_commit: "703234822d121c4e515e97d29b09e8953486d7b2"
      fixed_in_commit: "a323575a1a1abec9c9cb18aa040d4bc60eb4e4ee"
      regression_tests:
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
      evidence:
        - "The human screenshot shows the recipe-book control shifted into the first player-inventory row after combined-surface centering."
        - "The layout regression locks the 248-unit-screen upgraded-satchel recipe-button Y to 79, preserving vanilla relative y=61."
        - "The final clean build executed all 10 tasks and passed 39 tests with zero failures, errors, or skips."
        - "Human retest confirmed initial placement but reproduced the lower reset on every recipe-book open and close click."
        - "The toggle refinement changes no accepted panel geometry and the clean build again passed all 39 tests."
        - "The combined lifecycle retest confirmed the recipe-book button now remains at the correct Y; the human reported that behavior fixed."
    - id: "BUG-P7B-010"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Reopening inventory while the recipe book persisted open removed all integrated panel rendering for that screen session."
      impact: >
        With all bags equipped, the wide recipe book and vanilla inventory reopened normally but every bag panel and
        slot presentation disappeared. Repeated inventory reopenings while the book remained open did not recover it;
        the per-frame recipe-button correction disappeared at the same time.
      root_cause: >
        A server acknowledgement with an already-open wide recipe book and left pouch deliberately calls Screen.resize
        to recompute horizontal placement. Fabric Screen API recreates remove, after-background, and all other per-screen
        event objects before both init and resize. Scout26's weak identity guard correctly prevented a duplicate session
        open intent, but it returned before registering callbacks on the new event objects. Rendering and removal
        lifecycle hooks were therefore lost for the rest of that resized screen instance.
      fix: >
        On every AFTER_INIT invocation, reapply positioning and register render/removal callbacks against the current
        Fabric event objects. Only then consult the weak per-screen identity set to gate beginSession and the C2S open
        intent. A resize now refreshes callbacks without opening a second server session, while a new screen still sends
        exactly one open intent and its current remove callback closes the session normally.
      fixed_in_commit: "eba01156b95d8e13e44bc92fc34757c45e6eecca"
      evidence:
        - "The human supplied a deterministic five-step reproduction: persist the wide book open, close/reopen inventory, observe all bag panels missing, close the book, and observe the button correction missing until a book-closed inventory reopen."
        - "Exact Fabric Screen API 5.1.0+981dd9b24c ScreenMixin bytecode shows beforeInit is invoked for both init and resize and replaces removeEvent, afterBackgroundEvent, and every other per-screen event object before AFTER_INIT fires."
        - "The clean build executed all 10 tasks and passed 39 tests with zero failures, errors, or skips."
        - "The combined lifecycle retest confirmed persisted-open recipe-book reopen no longer loses panels; the human reported that behavior fixed."
    - id: "BUG-P7B-011"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "The wide recipe-book composition clipped an upgraded right pouch and visibly corrected its layout after the inventory first appeared."
      impact: >
        With both upgraded pouches equipped, the right panel extended beyond the viewport while unused space remained
        between the recipe book and left pouch. On every inventory open, vanilla first rendered unseeded coordinates;
        the late server acknowledgement then moved the inventory and revealed its bag panels a split second later.
      root_cause: >
        RecipeBookComponentMixin added the complete left-panel width only to vanilla's inventory leftPos, even though
        seven units overlap the inventory and the recipe book retained its original origin. Separately, client layout
        metadata began empty and the normal READY phase unconditionally resized an already-open wide screen after the
        acknowledgement, despite equipped Trinkets dimensions already being synchronized before InventoryScreen.init.
      fix: >
        Reserve only the left pouch's exposed width and compute right-edge overflow for the complete book, inventory,
        and pouch composition. Apply the same bounded overflow translation to RecipeBookComponent.getXOrigin and the
        inventory position, retaining room for vanilla's left tabs. Before InventoryScreen.init, seed presentation-only
        dimensions from synchronized equipped bags while leaving all dormant containers inactive until the server ACK.
        Resize at READY only when the ACK actually changes horizontal capacity, including deliberate in-screen pouch
        equipment changes; a normal open now retains its correct first-frame layout.
      fixed_in_commit: "d41673497d1bd17640e295cc9832084bc128cc50"
      regression_tests:
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
      evidence:
        - "At logical width 427, the layout regression locks both upgraded pouches to a 21-unit shared left translation and locks base pouches to zero overflow translation."
        - "Exact Minecraft 26.1.2 RecipeBookComponent source confirms getXOrigin controls the background and every child origin, while updateScreenPosition independently controls InventoryScreen.leftPos."
        - "The final clean build executed all 10 tasks and passed all 39 tests; exactly four ADR-012 Mixin targets remain and no @Overwrite exists."
        - "The human accepted the complete inventory and pouch layout plus first-frame behavior as good after the focused retest."
    - id: "BUG-P7B-012"
      phase: "P7-B"
      severity: "P2"
      status: "FIXED"
      summary: "Recipe-book category tabs remained at vanilla X after the book body moved left with the upgraded-pouch composition."
      impact: "The selected and visible recipe category tabs were drawn over the shifted recipe-book background instead of adjoining its left edge."
      root_cause: >
        RecipeBookComponent.updateTabs does not use getXOrigin. It independently calculates the tab X from
        `(width - 147) / 2 - xOffset - 30`, so BUG-P7B-011's shared getXOrigin translation moved every other
        book element but could not affect the tab widgets' cached coordinates.
      fix: >
        Inject after vanilla updateTabs and subtract the same bounded wideRecipeBookShift from every tab widget.
        Vanilla first resets each tab to an absolute position, so applying the correction at TAIL remains idempotent
        across initialization, visibility toggles, filtering, recipe updates, and tab visibility changes.
      fixed_in_commit: "797422cb707de27bfda4f704ffaf58579970ac90"
      regression_tests:
        - "IntegratedInventoryTest.classicLayoutUsesCapacityPrefixesAndExternalPanels"
      evidence:
        - "Exact Minecraft 26.1.2 RecipeBookComponent.updateTabs source confirms the independent hard-coded X calculation and absolute setPosition call."
        - "The clean build executed all 10 tasks and passed all 39 tests; exactly four ADR-012 Mixin targets remain and no @Overwrite exists."
        - "The rebuilt client logged Player366 into P7B-test with no Scout26 or Mixin startup error and remains open for focused visual confirmation."
        - "The human performed extensive item interactions and repeated inventory cycles with the recipe book open and closed, then accepted all UI elements including the corrected tabs as functional."

session_handoff_protocol:
  startup_steps:
    - "Read SCOUT26_AGENT_STATE.yaml completely."
    - "Check schema_version and current_phase/current_task."
    - "Run `git status --short --branch` if a repository exists."
    - "Confirm HEAD equals or descends from repository_state.last_known_good_commit when that field exists."
    - "Read the acceptance criteria for the active task."
    - "Inspect current primary docs/source for any uncertain API touched by the task."
    - "Run the cheapest baseline build/test relevant to the current state before large edits."
  shutdown_steps:
    - "Run acceptance checks appropriate to work performed."
    - "Update current task status and phase status."
    - "Update repository_state SHAs."
    - "Update dependency_lock if dependencies changed."
    - "Append decisions that will matter to future sessions."
    - "Append bugs/regressions discovered."
    - "Record commands/tests and outcomes in latest_session."
    - "Set next_action to one concrete action."
    - "Increment state_revision."
    - "Keep the file valid YAML."
  compression_rule: >
    Keep latest_session detailed. When session_history exceeds 20 entries, compress oldest entries into
    history_summary while preserving decisions, bug regressions, dependency changes, and commit SHAs.
  invariant: "The state file is part of the deliverable, not disposable notes."

