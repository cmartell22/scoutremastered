architecture:
  guiding_principle: >
    Equipment selects which physical bag ItemStacks are active. Each bag ItemStack owns its contents.
    A dedicated server-authoritative menu exposes those contents. UI is a view/controller, never the source of truth.

  invariants:
    - id: "INV-001"
      rule: "Bag contents are stored on the bag ItemStack in a custom typed data component."
    - id: "INV-002"
      rule: "Bag component values are immutable/value-like; never expose a mutable list stored inside a component."
    - id: "INV-003"
      rule: "Capacity is derived from the bag item definition, not trusted from serialized bag contents."
    - id: "INV-004"
      rule: "Invalid/out-of-range serialized entries are normalized or rejected safely; never crash a world load."
    - id: "INV-005"
      rule: "All inventory mutation is performed on the logical server."
    - id: "INV-006"
      rule: "Client packets express intent only; the server validates bag presence, menu ownership, slot, and action."
    - id: "INV-007"
      rule: "No static/global mutable map is the authoritative store for bag contents."
    - id: "INV-008"
      rule: "Do not rely on write-back only when a menu closes; mutation must persist safely as it occurs."
    - id: "INV-009"
      rule: "Bag items cannot be placed inside bag storage slots, including through shift-click."
    - id: "INV-010"
      rule: "Core phases P0-P6 use no vanilla inventory GUI mixins unless an ADR proves there is no reasonable API solution."
    - id: "INV-011"
      rule: "Common/server code must not reference client-only Minecraft classes."
    - id: "INV-012"
      rule: "Dedicated-server behavior is a release gate, not an afterthought."
    - id: "INV-013"
      rule: "Equipment discovery uses Trinkets Updated slot/attachment APIs."
    - id: "INV-014"
      rule: "The bag menu operates on live equipped bag ItemStacks, not detached copies."
    - id: "INV-015"
      rule: "Shift-click routing order is deterministic and documented."
    - id: "INV-016"
      rule: "Classic integrated-inventory UI, if added later, must delegate to the same tested core storage/menu model."

  preferred_data_model:
    component_id: "<mod_id>:bag_contents"
    conceptual_shape:
      format_version: 1
      entries: "immutable sparse list of {slot_index, ItemStack}; exact Codec/StreamCodec API to be verified in P2"
    normalization_rules:
      - "Ignore/reject negative slot indices."
      - "Ignore/reject indices >= capacity for the concrete bag item."
      - "Never persist empty stacks as meaningful entries unless the chosen codec pattern requires it."
      - "Reject nested bag ItemStacks when setting a bag storage slot."
      - "Copy ItemStacks at API boundaries where required to avoid aliasing/mutable-reference bugs."
    resolved_api_detail: >
      P2 verified Minecraft 26.1.2 source and registered the component with an explicit persistent Codec,
      explicit network StreamCodec, and encoding cache. ItemStackTemplate snapshots plus component replacement
      preserve immutability across normal ItemStack copies.

  preferred_runtime_objects:
    - name: "BagType / BagDefinition"
      responsibility: "Defines kind, capacity, equipment role, upgrade tier, and item-specific behavior."
    - name: "BagContents"
      responsibility: "Immutable serialized value stored in the ItemStack component."
    - name: "BagContainer"
      responsibility: >
        Server-side Container adapter over a live bag ItemStack. Reads component state and writes a replaced
        immutable component on mutation.
    - name: "EquippedBagHandle"
      responsibility: >
        Resolves and updates the live ItemStack in a specific Trinkets equipment slot/index. Must guard against
        stale/replaced stacks while a menu is open.
    - name: "PackMenu"
      responsibility: "Server-authoritative menu with bag slots + player inventory slots + shift-click rules."
    - name: "PackScreen"
      responsibility: "Client rendering/input for PackMenu only."
    - name: "OpenPackPayload"
      responsibility: "Minimal client-to-server intent for opening the pack; server re-discovers equipment."
    - name: "PackClient"
      responsibility: "Key mapping, screen registration, client-only rendering/tooltip hooks."
    - name: "TrinketsIntegration"
      responsibility: "Slot definitions/access/equip rules; isolate library-specific code behind a narrow layer."

  equipment_design:
    required_slots:
      satchel:
        count: 1
        semantic_location: "back/chest area"
      pouch:
        count: 2
        semantic_location: "belt/waist; stable indices define left/right ordering"
    resolved_implementation: >
      P3 uses Trinkets Updated's built-in chest/back and legs/belt IDs. Scout26 requests those slots for players,
      merges legs/belt to amount 2, assigns satchel/pouch item tags, and treats belt indices 0/1 as left/right.
      EquippedBagHandle re-resolves the live attachment slot and requires exact ItemStack identity.
    bag_stack_size: 1

  menu_design:
    open_action: "Configurable keybind; initial default B."
    open_flow:
      - "Client keybind sends OpenPack intent."
      - "Server validates player state and re-discovers equipped bags."
      - "Server opens PackMenu via current Fabric menu API."
      - "Client receives menu metadata needed only for layout; contents remain normal synchronized slots."
    slot_groups:
      - "satchel slots if equipped"
      - "left pouch slots if equipped"
      - "right pouch slots if equipped"
      - "player inventory"
      - "player hotbar"
    shift_click_policy_initial:
      player_to_bags_priority:
        - "satchel"
        - "left_pouch"
        - "right_pouch"
      algorithm:
        - "Merge into compatible non-full stacks first."
        - "Then fill empty eligible slots."
        - "Never insert bag items into bag slots."
      bag_to_player:
        - "Move to player inventory/hotbar using normal deterministic range."
    stale_handle_policy: >
      If the equipped ItemStack backing a BagContainer is replaced/removed while the menu is open,
      stop allowing mutation for that bag and close or resynchronize the menu safely. Never write old
      contents into an unrelated replacement ItemStack.

  rendering_design:
    phase: "P6"
    preference: "Use Trinkets Updated data-driven rendering/model attachment facilities when adequate."
    fallback: "Use code-driven rendering only when the data-driven API cannot express the required satchel/pouch model."
    rule: "Rendering bugs must never affect bag content correctness."

  optional_integrated_inventory:
    phase: "P7"
    default_enabled: false
    conditions_to_start:
      - "P0-P6 complete."
      - "Core release-candidate test matrix passes."
      - "A stable baseline tag/commit exists."
    constraints:
      - "Feature must be isolated behind a config/feature flag."
      - "Minimize mixin count and injection surface."
      - "Do not duplicate storage or click logic already implemented by PackMenu."
      - "If 26.1 vanilla internals make this brittle, ship without it."

testing_strategy:
  philosophy: "Every historical duplication/desync bug becomes a regression test or explicit manual test."
  execution_policy:
    automation_first:
      - >
        Automate every test that can be exercised and assessed reliably with unit/integration tests,
        test hooks, an integrated or dedicated Minecraft server, and one or more controlled clients.
      - >
        Prefer deterministic setup, scripted actions, logs, state assertions, persistence inspection,
        and repeatable lifecycle/multiplayer runs over user-driven testing.
      - >
        Use user-driven real-world testing only for behavior that cannot be automated credibly,
        such as irreducibly visual, subjective, or physical-input observations.
      - >
        Prefer automated Minecraft client profiles with master sound muted or disabled whenever the
        current client configuration supports it and the test is not specifically validating audio.
    user_driven_client_gate:
      - >
        When user-driven real-world testing is required, stop before launching the Minecraft client,
        explain what cannot be automated, and ask whether the user is ready to proceed.
      - "Do not launch the user-test client until the user explicitly confirms readiness."
      - >
        After confirmation, launch only the required client or clients and provide clear numbered
        test steps, expected results, and the observations the user should report.
    runtime_operation_confirmation:
      - >
        Treat every Minecraft client or server start/stop request as incomplete until the exact target is
        affirmatively verified from process identity plus appropriate startup/shutdown log or port evidence.
      - >
        Never infer that a process stopped because a stop command returned without error, and never proceed to a
        replacement launch until the prior target's exit is confirmed. Report only the state actually verified.
      - >
        Use direct exact-PID process control for routine teardown when graceful application shutdown is unnecessary.
        If a graceful Minecraft disconnect/save is required, ask the user to perform the simple in-game action or
        command, then verify logs, exact PID exit, and port state; do not add Windows UI automation solely for shutdown.
    evidence:
      - "Record which checks were automated and their exact commands/results."
      - "For every manual check, record why automation was insufficient and the user's observed result."
  crash_consistency:
    severity: "Release-blocking because item loss, duplication, or partial persistence is unacceptable."
    requirements:
      - >
        Automate abrupt dedicated-client disconnect, abrupt integrated client/server JVM termination,
        and abrupt dedicated-server termination with connected clients at multiple swap/save timings.
      - >
        Include a forced-termination case that does not use normal disconnect, Save and Quit, `/stop`,
        shutdown hooks, or another graceful save path, then restart the same world and identities.
      - >
        Recovery may contain the complete pre-transaction state or the complete post-transaction state,
        depending on the last durable save, but never a mixed/partial state, missing stack, duplicate stack,
        changed count, or stripped component.
      - >
        Treat prior graceful logout/restart/death/server-stop evidence as useful baseline coverage, not as
        proof of abrupt-process-termination safety.
  automated:
    discover_first:
      - "./gradlew tasks"
      - "Inspect current Fabric GameTest support before inventing task names."
    priorities:
      - "Codec/component round-trip tests where practical."
      - "BagContainer mutation tests."
      - "Nested-bag rejection."
      - "Capacity normalization."
      - "Shift-click routing logic factored into testable helpers where practical."
  required_manual_matrix:
    storage:
      - "Put items in each bag; close/reopen menu."
      - "Save and reload world."
      - "Restart game."
      - "Move/drop/pick up bag and verify contents stay with it."
      - "Rename/enchant/damage-compatible metadata changes do not detach contents."
    equipment:
      - "Equip/unequip empty bag."
      - "Equip/unequip non-empty bag."
      - "Replace one pouch with another."
      - "Swap left/right pouch ordering if supported."
      - "Open menu with only satchel, only one pouch, two pouches, all bags, and no bags."
    interaction:
      - "Normal click, right-click split, drag, double-click if supported by vanilla menu behavior."
      - "Shift-click player -> bags."
      - "Shift-click bag -> player."
      - "Hotbar number-key swap."
      - "Q and Ctrl+Q drop behavior."
      - "Attempt bag-inside-bag by every interaction path."
    lifecycle:
      - "Death with keepInventory=false."
      - "Death with keepInventory=true."
      - "Respawn."
      - "Disconnect while menu is open."
      - "Server shutdown/save while bags contain items."
    creative:
      - "Creative pick/block cloning does not duplicate non-empty bag contents unexpectedly."
      - "Creative delete/drop interactions do not desynchronize equipment."
      - "Copying a bag ItemStack behaves intentionally and is documented."
    multiplayer:
      - "Dedicated server with two clients."
      - "Simultaneous unrelated inventory actions by both players."
      - "Other players cannot mutate another player's bag."
      - "Rejoin server and verify persistence."
    compatibility:
      - "Run with Fabric API + Trinkets Updated only."
      - "Run without client-only optional UI mods."
      - "Verify clean dedicated server startup."

release_gates:
  build:
    - "Fresh checkout resolves dependencies."
    - "./gradlew clean build passes."
    - "No compilation warnings indicating client/common class leakage that are under project control."
  functional:
    - "Required manual matrix completed with results recorded."
    - "No open P0/P1 severity duplication, item-loss, crash, or world-corruption bugs."
    - "Dedicated server smoke test passes."
  documentation:
    - "README installation/dependencies are accurate."
    - "License files and third-party notices are present."
    - "Known limitations are documented."
    - "State file reflects final tested versions and baseline commit."

severity_model:
  P0: "Item duplication, item loss, world corruption, remote exploit, or dedicated-server hard crash."
  P1: "Common gameplay crash/desync or bag contents become inaccessible/wrong."
  P2: "Feature malfunction with workaround; rendering/UI significant bug."
  P3: "Polish, visual, wording, or minor compatibility issue."

phase_plan:
  P0:
    name: "Reconnaissance and reproducible bootstrap"
    status: "DONE"
    objective: "Create a minimal 26.1.x Fabric project that builds and runs before any bag logic."
    tasks:
      P0-T01:
        status: "DONE"
        action: >
          Re-verify the current recommended 26.1.x Minecraft patch, Java 25, Fabric Loader, Fabric API,
          non-remapping Loom, Gradle wrapper, and a compatible Trinkets Updated 26.1.x version using primary sources.
        outputs:
          - "Update dependency_lock below."
          - "Record URLs/commit/tag/version evidence in dependency_lock.evidence."
        acceptance:
          - "No version is chosen solely from this planning file."
      P0-T02:
        status: "DONE"
        action: >
          Initialize a fresh project from the Fabric 26.1.2 example/template shape.
          Use temporary identifiers only if the human has not supplied final name/mod_id/package.
        acceptance:
          - "./gradlew clean build passes."
          - "Client development run reaches title screen."
          - "Dedicated server development run starts without mod errors."
      P0-T03:
        status: "DONE"
        action: "Add Trinkets Updated dependency only; make no bag code yet."
        acceptance:
          - "./gradlew clean build passes."
          - "Client starts with Trinkets Updated."
          - "Dedicated server starts with Trinkets Updated."
      P0-T04:
        status: "DONE"
        action: "Commit/tag the reproducible empty baseline."
        acceptance:
          - "git working tree clean."
          - "baseline commit SHA recorded in repository_state.baseline_commit."
    exit_gate: "All P0 tasks accepted and dependency_lock complete."

  P1:
    name: "Items and static game data"
    status: "DONE"
    objective: "Register bag/material items and static assets without storage behavior."
    tasks:
      - "Register satchel, upgraded satchel, pouch, upgraded pouch, and any chosen crafting materials."
      - "Set bag max stack size to 1."
      - "Add translations and basic generated/static item models."
      - "Add temporary/simple recipes only after confirming desired crafting design."
    acceptance:
      - "All items obtainable in development."
      - "No missing-model texture errors for intended assets."
      - "Client and dedicated server still start."
      - "./gradlew clean build passes."

  P2:
    name: "Bag contents data model"
    status: "DONE"
    objective: "Make a bag ItemStack persist contents correctly without Trinkets or custom UI."
    tasks:
      - "Implement BagContents immutable value and registered custom data component."
      - "Implement normalization/validation by concrete item capacity."
      - "Implement BagContainer adapter over one live ItemStack."
      - "Implement nested-bag rejection centrally."
      - "Add tests for round-trip, capacity, mutation, and copy semantics where practical."
      - "Create a temporary developer command/test hook to inspect/fill bag contents if needed."
    acceptance:
      - "Component survives ItemStack serialization/save-load."
      - "Contents follow ItemStack copies according to normal ItemStack copy semantics and documented creative behavior."
      - "No aliasing bug: changing one bag's storage never mutates another bag unintentionally."
      - "Out-of-range/corrupt entries fail safely."
      - "./gradlew clean build passes."
    mandatory_review_question: >
      Is the component's network/persistence configuration correct for 26.1.x ItemStack synchronization?
      Verify against actual source/API, not memory.

  P3:
    name: "Trinkets equipment integration"
    status: "DONE"
    objective: "Equip and reliably locate one satchel and two pouches."
    tasks:
      - "Study current Trinkets Updated testmod/wiki/API for 26.1.x."
      - "Define/request data-driven equipment slots."
      - "Restrict satchel to back role and pouches to belt role."
      - "Implement TrinketsIntegration and EquippedBagHandle."
      - "Define stable left/right pouch ordering from slot indices."
      - "Handle equip/unequip with non-empty bags without moving contents out of the ItemStack."
    acceptance:
      - "Correct items equip only to intended roles."
      - "Server can locate live equipped bag stacks."
      - "Replacing/unequipping a bag cannot cause contents to jump to another bag."
      - "Dedicated server passes."
      - "./gradlew clean build passes."

  P4:
    name: "Unified Pack Menu MVP"
    status: "DONE"
    objective: "Ship the core usable gameplay loop with a dedicated synchronized bag menu."
    tasks:
      - "Register current Fabric menu type/provider."
      - "Implement OpenPack keybind and minimal C2S open intent."
      - "Server re-discovers equipped bags and opens PackMenu."
      - "Implement bag storage slots, player inventory slots, and hotbar slots."
      - "Implement deterministic shift-click routing."
      - "Implement PackScreen using 26.1 render-state/extractor-era GUI APIs."
      - "Gracefully handle no bags or bag removal while menu is open."
    acceptance:
      - "All equipped bag contents are accessible from one screen."
      - "Normal slot actions behave correctly."
      - "Shift-click behavior matches documented policy."
      - "Bag-inside-bag is impossible."
      - "No custom packet directly mutates an inventory slot."
      - "Dedicated server + remote client test passes."
      - "./gradlew clean build passes."

  P5:
    name: "Hardening, lifecycle, anti-dupe, multiplayer"
    status: "DONE"
    objective: "Attack the implementation with historical Scout failure modes."
    tasks:
      - "Run the full required_manual_matrix except rendering-specific checks."
      - "Test survival/creative/death/respawn/logout/server restart."
      - "Test hotbar swap, Q/Ctrl+Q, drag, shift-click, equipment replacement."
      - "Test stale EquippedBagHandle behavior."
      - "Add regression tests for every bug found."
      - "Review thread-safety/logical-side assumptions."
    acceptance:
      - "No open P0/P1 bugs."
      - "Every discovered duplication/loss bug has a regression entry."
      - "Two-client dedicated-server test passes."
      - "./gradlew clean build passes."

  P6:
    name: "Tooltip, wearable rendering, recipes, polish"
    status: "DONE"
    objective: "Add presentation only after storage correctness is stable."
    tasks:
      - "Add compact contents tooltip with sensible limits."
      - "Implement satchel/pouch wearable rendering, preferring Trinkets data-driven facilities."
      - "Add/finalize textures/models."
      - "Finalize recipes and item group/tab placement."
      - "Add basic config only for clearly useful options such as keybind/UI behavior where appropriate."
      - "Accessibility pass on PackScreen labels/narration where APIs support it."
    acceptance:
      - "Rendering has no server-side class leakage."
      - "Models render in third person; first person behavior documented."
      - "Tooltip never mutates contents."
      - "Fresh build and required manual tests pass."

  P7:
    name: "Optional classic Integrated Inventory"
    status: "DONE"
    objective: "Explore classic Scout-like slots around vanilla inventory without compromising the core."
    decision_gate: >
      Human must explicitly approve starting P7 after P0-P6 release-candidate baseline.
      If the implementation requires broad fragile mixins, recommend shipping without P7.
    tasks:
      - "Prototype UI-only integration against the proven storage model."
      - "Minimize and document each mixin."
      - "Feature-flag the integration."
      - "Repeat creative/multiplayer/recipe-book/inventory interaction regression matrix."
    acceptance:
      - "Disabling feature returns to mixin-free PackMenu experience."
      - "No storage logic is duplicated."
      - "No P0/P1 regression."
      - "Every mixin has target, reason, failure mode, and version-risk documentation."
    subphases:
      P7-A:
        name: "Integrated Inventory prototype architecture"
        status: "DONE"
        scope: "Research and architecture only; do not implement the prototype in this subphase."
        acceptance:
          - "Exact Minecraft 26.1.2 inventory-screen/menu sources and relevant Fabric Mixin facilities are reviewed."
          - "An ADR defines the smallest viable injection surface, server-authority boundaries, feature-flag behavior, failure modes, and version risks."
          - "The design delegates storage and mutation to the existing live bag containers/menu model without creating a second authoritative store."
          - "A documented go/no-go recommendation gates P7-B."
      P7-B:
        name: "Integrated Inventory prototype implementation"
        status: "DONE"
        decision_gate: "Do not implement until P7-A architecture is accepted and the human explicitly authorizes P7-B."

  P8:
    name: "Release candidate and packaging"
    status: "DONE"
    objective: "Produce a clean, documented release artifact."
    tasks:
      - "Run all release gates."
      - "Create changelog and known-limitations section."
      - "Finalize project name/mod_id/package/license if still temporary."
      - "Verify fabric.mod.json dependency ranges."
      - "Verify jar contents and source/license notices."
      - "Tag release candidate."
    acceptance:
      - "Release gates all green."
      - "State file points to tested commit and artifact."
      - "No temporary project identifiers remain unless explicitly approved."

  P9:
    name: "Ready Slots"
    status: "RS5_COMPLETE"
    objective: >
      Alias slot 0 of each equipped Scout bag as a rendered ready position and provide a
      server-authoritative full-stack swap with the selected hotbar slot.
    detailed_plan: "SCOUT_READY_SLOTS_FEATURE.yaml"
    current_subphase: "RS5"
    current_subphase_name: "Transform and compatibility polish"
    architecture_record: "docs/adr/ADR-013-ready-slots-rs0-architecture.md"
    completion_gate: >
      P9 core is complete only after RS4 passes without item loss, duplication, corruption,
      partial crash persistence, ghost stacks, or unresolved desynchronization. RS5 is polish;
      RS6 and RS7 remain deferred.

