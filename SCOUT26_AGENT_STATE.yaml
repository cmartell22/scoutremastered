openai_agent_model_plan:
  strategy:
    default_model: "GPT-5.6 Terra High"
    principle: >
      Use the least expensive model that maintains a high probability of
      correctness. Escalate to Sol for API-sensitive, architectural, persistence,
      synchronization, anti-dupe, or difficult debugging work.

  stages:
    - stage: "P0-T01"
      name: "Dependency and version research"
      model: "GPT-5.6 Sol Medium"
      reason: >
        Requires careful reconciliation of Minecraft/Fabric/Loom/Trinkets versions,
        current APIs, and primary-source evidence.

    - stage: "P0-T02"
      name: "Bootstrap fresh project"
      model: "GPT-5.6 Terra High"
      reason: >
        Primarily implementation of an established project structure plus
        Gradle/build troubleshooting.

    - stage: "P0-T03"
      name: "Add Trinkets dependency"
      model: "GPT-5.6 Terra Medium"
      reason: >
        Narrow dependency/configuration task with clear build and server
        acceptance tests.

    - stage: "P0-T04"
      name: "Baseline commit and agent-state update"
      model: "GPT-5.6 Terra Medium"
      reason: >
        Mechanical verification, Git bookkeeping, and state maintenance.

    - stage: "P1"
      name: "Items and static assets"
      model: "GPT-5.6 Terra Medium"
      reason: >
        Mostly repetitive registrations, assets, translations, models,
        recipes, and straightforward validation.

    - stage: "P2"
      name: "BagContents, data components, and storage"
      model: "GPT-5.6 Sol High"
      reason: >
        Correctness-critical persistence work involving immutability,
        serialization, copying, normalization, ItemStack storage, networking,
        and aliasing. Errors can cause item loss or duplication.

    - stage: "P3"
      name: "Trinkets equipment integration"
      model: "GPT-5.6 Sol Medium"
      reason: >
        Requires careful use of current Trinkets APIs and correct handling
        of equipped ItemStack identity and lifecycle.
      escalation_model: "GPT-5.6 Sol High"
      escalate_if:
        - "Live ItemStack identity becomes ambiguous."
        - "EquippedBagHandle becomes stale."
        - "Equipment synchronization behaves unexpectedly."

    - stage: "P4"
      name: "Unified PackMenu"
      model: "GPT-5.6 Sol High"
      reason: >
        High-risk client/server inventory architecture involving server authority,
        synchronized slots, shift-click behavior, live equipped stacks,
        stale handles, and mutation boundaries.

    - stage: "P5"
      name: "Anti-dupe, lifecycle, and multiplayer hardening"
      model: "GPT-5.6 Sol High"
      reason: >
        Requires adversarial reasoning across death, creative mode,
        disconnects, multiplayer, stale stacks, item movement, duplication,
        loss, corruption, and desynchronization.

    - stage: "P6"
      name: "Tooltip, rendering, recipes, and polish"
      model: "GPT-5.6 Terra High"
      reason: >
        Competent implementation and API work is needed, but this stage is
        intentionally separated from storage and inventory correctness.
      escalation_model: "GPT-5.6 Sol Medium"
      escalate_if:
        - "Minecraft 26.1 rendering APIs are unclear."
        - "Trinkets rendering behavior differs from documented expectations."
        - "A rendering issue appears to involve architecture rather than presentation."

    - stage: "P7-A"
      name: "Integrated Inventory prototype architecture"
      model: "GPT-5.6 Sol High"
      reason: >
        Vanilla inventory modification and mixin design are version-sensitive
        and architecturally risky. The initial design decision deserves the
        strongest reasoning model.

    - stage: "P7-B"
      name: "Integrated Inventory prototype implementation"
      model: "GPT-5.6 Terra High"
      reason: >
        Once exact mixin targets, invariants, and architecture are established,
        implementation can be downshifted to Terra High.
      escalation_model: "GPT-5.6 Sol High"
      escalate_if:
        - "Mixin targets fail or differ from researched mappings."
        - "Vanilla inventory behavior regresses."
        - "Synchronization or duplication concerns appear."
        - "The established architecture must change."

    - stage: "P8"
      name: "Release candidate, packaging, and final verification"
      model: "GPT-5.6 Terra High"
      reason: >
        Primarily exhaustive verification, dependency ranges, documentation,
        licenses, artifact inspection, cleanup, and packaging.
      escalation_model: "GPT-5.6 Sol High"
      escalate_if:
        - "Any unexplained duplication occurs."
        - "Any item loss or corruption occurs."
        - "Client/server desynchronization occurs."
        - "Serialization or persistence fails."
        - "A release-gate regression cannot be explained."

  execution_order:
    - "P0-T01: GPT-5.6 Sol Medium"
    - "P0-T02: GPT-5.6 Terra High"
    - "P0-T03: GPT-5.6 Terra Medium"
    - "P0-T04: GPT-5.6 Terra Medium"
    - "P1: GPT-5.6 Terra Medium"
    - "P2: GPT-5.6 Sol High"
    - "P3: GPT-5.6 Sol Medium"
    - "P4: GPT-5.6 Sol High"
    - "P5: GPT-5.6 Sol High"
    - "P6: GPT-5.6 Terra High"
    - "P7-A: GPT-5.6 Sol High"
    - "P7-B: GPT-5.6 Terra High"
    - "P8: GPT-5.6 Terra High"

  model_roles:
    "GPT-5.6 Terra Medium":
      use_for:
        - "Mechanical changes"
        - "Static assets"
        - "Simple registrations"
        - "Straightforward dependency changes"
        - "Git and agent-state bookkeeping"
        - "Known validation procedures"

    "GPT-5.6 Terra High":
      use_for:
        - "Normal implementation work"
        - "Implementation after architecture is established"
        - "Build troubleshooting"
        - "Rendering and polish"
        - "Release verification and packaging"

    "GPT-5.6 Sol Medium":
      use_for:
        - "Unfamiliar API investigation"
        - "Version-sensitive research"
        - "Moderately important design decisions"
        - "Source-code/API reconciliation"
        - "Integration work with nontrivial semantics"

    "GPT-5.6 Sol High":
      use_for:
        - "Persistence and serialization architecture"
        - "Inventory architecture"
        - "Client/server synchronization"
        - "Anti-duplication reasoning"
        - "Item-loss and corruption prevention"
        - "Multiplayer lifecycle correctness"
        - "Risky mixin architecture"
        - "Major architecture changes"
        - "Difficult unexplained regressions"

  global_escalation_rules:
    - condition: "A difficult blocker remains after two serious attempts."
      action: "Escalate to GPT-5.6 Sol High."

    - condition: >
        The task involves possible duplication, item loss, corruption,
        persistence failure, or client/server desynchronization.
      action: "Use GPT-5.6 Sol High."

    - condition: >
        The current API or version behavior must be researched before
        implementation can safely continue.
      action: "Use at least GPT-5.6 Sol Medium."

  global_downshift_rule: >
    Once the architecture, API usage, and invariants have been verified,
    and the remaining work is primarily mechanical implementation or
    verification, downshift from Sol to Terra.

  summary:
    default: "GPT-5.6 Terra High"
    cheapest_routine_model: "GPT-5.6 Terra Medium"
    research_model: "GPT-5.6 Sol Medium"
    correctness_critical_model: "GPT-5.6 Sol High"

