test_execution_policy:
  automation_first:
    - >
      Automate every Ready Slots check that can be exercised and assessed reliably with unit/integration
      tests, temporary deterministic test hooks, an integrated or dedicated Minecraft server, and one or
      more controlled clients.
    - >
      Automate swap correctness, spam, persistence, lifecycle, equipment replacement, hotbar changes,
      multiplayer ownership/isolation, synchronization, dedicated-server loading, and render crash coverage
      wherever deterministic observation is possible.
    - >
      Use user-driven real-world testing only for behavior that cannot be automated credibly, especially
      final visual placement, clipping, animation, and subjective presentation judgments.
    - >
      Prefer automated Minecraft client profiles with master sound muted or disabled whenever the verified
      26.1.2 client configuration supports it and the test is not specifically validating audio.
  user_driven_client_gate:
    - >
      If a remaining acceptance check requires user-driven real-world testing, pause before launching the
      Minecraft client, identify the non-automatable check, and ask whether the user is ready to proceed.
    - "Do not launch the user-test client until the user explicitly confirms readiness."
    - >
      After confirmation, launch only the required client or clients and provide clear numbered test steps,
      expected results, and the exact observations the user should report.
  runtime_operation_confirmation:
    - >
      Treat every Minecraft client or server start/stop request as incomplete until the exact target is
      affirmatively verified from process identity plus appropriate startup/shutdown log or port evidence.
    - >
      Never infer that a process stopped because a stop command returned without error, and never proceed to a
      replacement launch until the prior target's exit is confirmed. Report only the state actually verified.
    - >
      Use direct exact-PID process control for routine teardown when graceful application shutdown is unnecessary.
      If a graceful Minecraft disconnect/save is required, ask the user to perform the simple in-game action or
      command, then verify logs, exact PID exit, and port state; do not add Windows UI automation solely for shutdown.
  evidence:
    - "Record automated commands, harnesses, client/server topology, identities, assertions, and results."
    - "For each manual check, record why automation was insufficient and the user's observed result."

