      - >
        In the muted two-client dedicated-server run, the human passed remote left/right/back position, live slot-0
        updates, unsupported and empty suppression, unequip suppression, and absence of all old bag models.
      - >
        The remote crouch result matched singleplayer: hip-item leg occlusion remains expected RS5 transform/anchor
