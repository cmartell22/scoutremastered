rs0_architecture_lock:
  status: ACCEPTED
  decision_record: "docs/adr/ADR-013-ready-slots-rs0-architecture.md"
  rs1_presentation_contract_commit: "53917345f742d6e196aefcecd42f9ee4cc87dcdf"
  source_baseline:
    minecraft: "26.1.2 exact Loom-resolved common/client sources"
    fabric_networking_api: "6.3.1+554860db4c"
    trinkets_updated: "4.0.0-beta.3+26.1"
    scout_commit_reviewed: "f0c0225"
  decisions:
    selected_hotbar_mutation: >
      On the server thread, validate and snapshot both owners, replace exact bag-local slot 0 through
      BagContainer, then use Inventory.setSelectedItem(ItemStack), Inventory.setChanged(), and
      ServerPlayer.inventoryMenu.broadcastChanges(). Roll back exact snapshots on any representable
      second-write failure.
    payload_codec: >
      Send only a ReadySlotRole with an explicit stable VarInt ID. Decode with explicit bounds checking;
      malformed IDs fail closed and never fall back to a valid role.
    component_sync: >
      BAG_CONTENTS is carried by the full ItemStack component patch. Trinkets detects component-only
      equipped-stack changes with ItemStack.matches and sends full SyncInventoryPayload stacks to tracking
      players; container ID 0 supplies the immediate owning-client update.
    render_whitelist: >
      Render ItemTags.SWORDS, AXES, PICKAXES, SHOVELS, and HOES plus BowItem, CrossbowItem, TridentItem,
      and ShieldItem instances. Unsupported stacks remain storable and swappable but invisible.
    renderer: >
      Extend the existing BagTrinketRenderer. Minecraft 26.1.2 ItemModelResolver accepts an arbitrary
      ItemStack into a fresh ItemStackRenderState, so submit the eligible ready stack instead of the equipped
      bag stack. The old pouch/satchel image is removed; no new player-render mixin or equipment slot is needed.
    empty_render_rule: >
      Submit no item model when slot 0 is empty, its stack is not whitelisted, the role/equipped bag is invalid,
      or no corresponding pouch/satchel is equipped. Never fall back to rendering the bag image.
    persistence: >
      Vanilla inventory and Trinkets equipment serialize into one player ValueOutput and one temporary/live/
      backup player-data replacement. A server-thread swap cannot interleave with save serialization, so an
      abrupt restart must recover one complete pre-state or one complete post-state, never a mixed half-swap.
    clean_room: >
      Combat Amenities remains an all-rights-reserved behavior/API reference only. No source, constants,
      transforms, assets, class structure, packet layout, comments, or tests may be copied; none was opened in RS0.
  crash_harness:
    controller: "External process owns exact JVM PIDs and force-terminates without /stop, save-all, disconnect, shutdown hooks, or cleanup."
    fixtures: "Isolated copied worlds, deterministic identities, and component-rich marker stacks with a durably verified pre-state."
    timing_windows:
      - "before server commit"
      - "immediately after server commit"
      - "after client acknowledgement"
      - "around normal save cadence"
      - "during deterministic repeated swaps"
    topologies:
      - "integrated client/server JVM hard kill and same-world restart"
      - "dedicated server hard kill with connected automated clients and same-world restart"
      - "dedicated automated client hard kill while the authoritative server remains alive, followed by reconnect"
    oracle: >
      The recovered hotbar/bag pair and all stack components must exactly equal one allowed complete snapshot.
      Loss, duplication, corruption, a mixed pre/post pair, or unexplained desynchronization is release-blocking.
    client_audio: "Preconfigure automated clients with sound categories at zero whenever the verified 26.1.2 options format permits it."
  verification:
    completion_commit: "75b9836bc1a508f0be01d01c1ff597780a4443cf"
    exact_source_inspection: PASS
    renderer_structural_proof: PASS
    code_baseline: "Production/test source is unchanged from release-candidate commit ddcdb89."
    retained_tests: "39 tests, zero failures or errors, from the unchanged release-candidate baseline."
    fresh_gradle_attempt: >
      BLOCKED_BY_HOST: wrapper and cached Gradle 9.5.1 could not establish the single-use daemon loopback
      connection on this execution host. This is not counted as a fresh pass and no source failure was observed.
    client_launch: "Not required and not performed."
  blockers: []
  next_action: "Await explicit authorization, then begin RS1 read-only rendering proof."

rs1_implementation:
  status: COMPLETE
  implementation_commit: "75ac7f0f13326af25e2cc8069884f70a926d0691"
  implementation:
    renderer: >
      BagTrinketRenderer now validates its expected back/belt Trinkets slot, reads normalized BAG_CONTENTS slot 0,
      and submits only a whitelisted ready stack. It returns without any item-model submission for empty,
      unsupported, missing, or invalid states, so the old equipped bag image cannot be rendered as a fallback.
    whitelist: "ItemTags.SWORDS, AXES, PICKAXES, SHOVELS, HOES; BowItem; CrossbowItem; TridentItem; ShieldItem."
    mutation_boundary: "No common/server code, bag mutation, payload, keybind, menu, component, or config change."
  automated_evidence:
    - >
      Direct javac compilation against the exact locally resolved Minecraft 26.1.2 common/client artifacts,
      Fabric Loader 0.19.3, Fabric API modules, Trinkets Updated 4.0.0-beta.3+26.1, JOML, and current main
      classes produced the replacement renderer class successfully.
    - >
      javap of that compiled class proved BAG_CONTENTS -> normalized(capacity) -> getStack(0) feeds
      ItemModelResolver.appendItemLayers; the equipped bag ItemStack is not its model argument.
    - "Common-source client-reference audit passed."
    - >
      A fresh direct JUnit Platform run used Fabric Loader JUnit 0.19.3's Knot-backed launcher session and the
      exact cached Minecraft/Fabric/Trinkets artifacts. All 39 existing tests started and passed with zero
      failures, aborts, or skips; the isolated launcher/classes were removed afterward.
    - >
      Two direct dedicated-server attempts loaded Fabric, Scout Remastered, Trinkets, 1519 recipes, and 1617
      advancements without a project classloading or Mixin error before the host failed to create Netty's Java
      selector. The second attempt also used the installed legacy WindowsSelectorProvider and failed identically.
    - >
